name: Build QavatarsRevived

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  module_id: QavatarsRevived

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install QPM
        uses: Fernthedev/qpm-action@v1
        with:
          restore: true
          cache: false
          workflow_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - inspect resolved headers
        run: |
          echo "--- resolve the bs-cordl symlink target ---"
          readlink -f extern/includes/bs-cordl/include
          echo "--- does the symlink target exist? ---"
          ls -la "$(readlink -f extern/includes/bs-cordl/include)" 2>&1 | head -20
          echo "--- following symlinks with -L this time ---"
          find -L extern/includes/bs-cordl -iname "*.hpp" | wc -l
          find -L extern/includes/bs-cordl -iname "*.hpp" | head -20
          echo "--- the QPM-RS cache dir directly ---"
          ls -la /home/runner/.local/share/QPM-RS/cache/bs-cordl/ 2>&1
          ls -la /home/runner/.local/share/QPM-RS/cache/bs-cordl/4008.0.0/ 2>&1
          find /home/runner/.local/share/QPM-RS/cache/bs-cordl/4008.0.0/ -maxdepth 3 2>&1 | head -40
          echo "--- disk usage of that cache entry ---"
          du -sh /home/runner/.local/share/QPM-RS/cache/bs-cordl/4008.0.0/ 2>&1

      - name: Read mod version
        id: mod-version
        run: |
          version=$(jq -r '.info.version' qpm.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: |
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DMOD_VERSION=${{ steps.mod-version.outputs.version }} \
            -Bbuild -S.

      - name: Build
        run: cmake --build build

      - name: Build qmod package
        run: qpm qmod build

      - name: Locate build artifacts
        id: artifacts
        run: |
          so_file=$(find build -maxdepth 1 -name "*.so" | head -n1)
          qmod_file=$(find . -maxdepth 1 -name "*.qmod" | head -n1)
          echo "so_path=$so_file" >> "$GITHUB_OUTPUT"
          echo "qmod_path=$qmod_file" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.module_id }}-${{ steps.mod-version.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.so_path }}
            ${{ steps.artifacts.outputs.qmod_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.so_path }}
            ${{ steps.artifacts.outputs.qmod_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
