name: Build QavatarsRevived

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  module_id: QavatarsRevived

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install QPM
        uses: Fernthedev/qpm-action@v1
        with:
          restore: true
          cache: false
          workflow_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read mod version
        id: mod-version
        run: |
          version=$(jq -r '.info.version' qpm.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: |
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DMOD_VERSION=${{ steps.mod-version.outputs.version }} \
            -Bbuild -S.

      - name: Build
        run: cmake --build build || true

      - name: Debug - symbol table inspection
        run: |
          echo "--- find the object file that references SetParent ---"
          OBJ=$(find build -name "modelImporter.cpp.o" | head -1)
          echo "object file: $OBJ"
          echo "--- nm on that object file, grep SetParent (T=defined, U=undefined) ---"
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm "$OBJ" | grep -i "SetParent" || echo "no SetParent symbol found in this object at all"
          echo "--- full nm output line count and a sample of Transform-related symbols ---"
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm "$OBJ" | grep -i "Transform" | head -20
          echo "--- re-run the actual failing link command with verbose output ---"
          cmake --build build --verbose 2>&1 | tail -60

      - name: Fail if build actually failed
        run: |
          test -f build/libQavatarsRevived.so || (echo "BUILD DID NOT PRODUCE OUTPUT" && exit 1)

      - name: Build qmod package
        run: qpm qmod build

      - name: Locate build artifacts
        id: artifacts
        run: |
          so_file=$(find build -maxdepth 1 -name "*.so" | head -n1)
          qmod_file=$(find . -maxdepth 1 -name "*.qmod" | head -n1)
          echo "so_path=$so_file" >> "$GITHUB_OUTPUT"
          echo "qmod_path=$qmod_file" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.module_id }}-${{ steps.mod-version.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.so_path }}
            ${{ steps.artifacts.outputs.qmod_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.so_path }}
            ${{ steps.artifacts.outputs.qmod_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
