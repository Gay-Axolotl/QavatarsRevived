name: Build QavatarsRevived

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  module_id: QavatarsRevived

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install QPM
        uses: Fernthedev/qpm-action@v1
        with:
          restore: true
          cache: false
          workflow_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read mod version
        id: mod-version
        run: |
          version=$(jq -r '.info.version' qpm.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Matches the real reference mod's build.ps1: qpm_defines.cmake (generated
      # by `qpm restore` above, included as the first line of CMakeLists.txt)
      # sets up the NDK toolchain/ABI/platform/MOD_VERSION internally -- we
      # don't pass those as manual -D flags on the command line here anymore,
      # since doing so previously seemed to conflict with what qpm_defines.cmake
      # expects to configure itself.
      - name: Configure CMake
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -B build

      - name: Build
        run: cmake --build build

      - name: Debug - inspect qpm.shared.json
        run: |
          echo "--- full qpm.shared.json ---"
          cat qpm.shared.json
          echo "--- line 19 specifically ---"
          sed -n '15,25p' qpm.shared.json

      - name: Build qmod package
        run: qpm qmod manifest

      - name: Locate build artifacts
        id: artifacts
        run: |
          so_file=$(find build -maxdepth 1 -name "*.so" | head -n1)
          qmod_file=$(find . -maxdepth 1 -name "*.qmod" | head -n1)
          echo "so_path=$so_file" >> "$GITHUB_OUTPUT"
          echo "qmod_path=$qmod_file" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.module_id }}-${{ steps.mod-version.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.so_path }}
            ${{ steps.artifacts.outputs.qmod_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.so_path }}
            ${{ steps.artifacts.outputs.qmod_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
